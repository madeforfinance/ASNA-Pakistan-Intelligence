name: ASNA Hourly Intelligence

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asna-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --no-cache-dir -r requirements.txt
          .venv/bin/python -m pip install --no-cache-dir aiohttp aiosqlite

      - name: Verify Python environment
        run: |
          .venv/bin/python -c "import sys; print('Python:', sys.executable)"
          .venv/bin/python -c "import aiohttp; print('aiohttp:', aiohttp.__version__)"
          .venv/bin/python -c "import aiosqlite; print('aiosqlite:', aiosqlite.__version__)"

      - name: Run collector
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          INTELLIGENCE_DB: data/intelligence.db
        run: |
          .venv/bin/python -m news.collector

      - name: Run event engine
        run: |
          .venv/bin/python news/event_engine.py

      - name: Run impact engine
        run: |
          .venv/bin/python news/impact_engine.py

      - name: Run alert engine
        run: |
          .venv/bin/python news/alert_engine.py

      - name: Report alerts to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          INTELLIGENCE_DB: data/intelligence.db
        run: |
          .venv/bin/python news/discord_reporter.py

      - name: Persist SQLite database
        run: |
          git config user.name "ASNA Pakistan Intelligence Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/intelligence.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: update intelligence database"
            git push origin main
          fi