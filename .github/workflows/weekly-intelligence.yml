name: ASNA Weekly Intelligence

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asna-intelligence
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run weekly digest
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          INTELLIGENCE_DB: data/intelligence.db
        run: python news/weekly_digest.py

      - name: Run trend engine
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          INTELLIGENCE_DB: data/intelligence.db
        run: python news/trend_engine.py

      - name: Persist SQLite database
        run: |
          git config user.name 'ASNA Pakistan Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intelligence.db
          if git diff --cached --quiet; then
            echo 'No database changes to commit.'
          else
            git commit -m 'chore: update weekly intelligence state'
            git push
          fi
